# snmpd for the isolated SOC lab. Read-only community "public", full MIB-2 view
# (Debian's default restricts to the system subtree with -V systemonly; we expose
# the whole tree so benign polling AND Phase-2 walk/recon traffic are realistic).

agentaddress udp:161

rocommunity public default

sysLocation    "SOC Lab - isolated bridge"
sysContact     "soc@example.local"
sysName        "collector.example.local"
sysServices    72

# Keep the daemon quiet about the missing /proc bits in a container.
dontLogTCPWrappersConnects yes
