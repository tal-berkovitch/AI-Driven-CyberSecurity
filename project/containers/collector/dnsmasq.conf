# dnsmasq for the isolated SOC lab — authoritative-ish resolver for example.local.
# No upstream (the bridge has no WAN route), so only the local zone resolves;
# unknown names under the zone return NXDOMAIN (realistic benign miss traffic).

no-resolv          # never forward upstream (there is no upstream on an internal bridge)
no-hosts           # ignore /etc/hosts
log-queries        # visible in `docker compose logs collector`
log-facility=-     # log to stderr
bind-interfaces

# Treat example.local as a locally-served zone (no forwarding, NXDOMAIN if absent).
local=/example.local/
domain=example.local

# A / AAAA host records
host-record=www.example.local,10.20.0.10,fd00:cafe::10
host-record=api.example.local,10.20.0.11,fd00:cafe::11
host-record=mail.example.local,10.20.0.12,fd00:cafe::12
host-record=db.example.local,10.20.0.13
host-record=cdn.example.local,10.20.0.14
host-record=ntp.example.local,10.20.0.15
host-record=vpn.example.local,10.20.0.16

# MX + TXT so those qtypes get real answers
mx-host=example.local,mail.example.local,10
txt-record=example.local,"v=spf1 mx -all"
txt-record=_dmarc.example.local,"v=DMARC1; p=none; rua=mailto:dmarc@example.local"

# PTR for reverse lookups of a couple hosts
ptr-record=10.0.20.10.in-addr.arpa,www.example.local
ptr-record=11.0.20.10.in-addr.arpa,api.example.local
