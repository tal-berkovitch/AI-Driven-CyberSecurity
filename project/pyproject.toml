[project]
name = "soc-dns-snmp"
version = "0.1.0"
description = "Multi-agent AI SOC for DNS/SNMP anomaly detection and CTI generation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Traffic capture (Phase 1, collector tap)
capture = ["scapy>=2.5"]
# Benign/attack traffic generation (Phase 1+, attacker)
generate = ["dnspython>=2.6"]
# Detection backends (Phase 2). `morpheus` is installed separately on the lab box.
detect = ["scikit-learn>=1.4", "torch>=2.2"]
# Enrichment + CTI (Phase 3)
cti = ["groq>=0.11", "sentence-transformers>=3.0", "chromadb>=0.5"]
# UI + orchestration (Phase 4)
ui = ["chainlit>=1.1", "ag2>=0.3"]
# Dev tooling
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
# This is an application, not a library — don't try to build/install the repo itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `shared` importable; "containers" makes the per-agent packages
# importable under the SAME name they use in their images (e.g. `defender.features`).
pythonpath = [".", "containers"]
